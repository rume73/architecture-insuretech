apiVersion: apps/v1
kind: Deployment
metadata:
  name: insuretech-test-app
  labels:
    app: insuretech-test-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insuretech-test-app
  template:
    metadata:
      labels:
        app: insuretech-test-app
    spec:
      containers:
      - name: app
        image: ghcr.io/yandex-practicum/scaletestapp:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "20Mi"
          limits:
            memory: "30Mi"