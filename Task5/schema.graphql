"""
Клиент сервиса InsureTech.
"""
type Client {
    "Уникальный идентификатор клиента"
    id: ID!
    "ФИО клиента"
    name: String!
    "Возраст клиента"
    age: Int
    "Список документов клиента"
    documents: [Document!]!
    "Список родственников клиента"
    relatives: [Relative!]!
}

"""
Документ клиента.
"""
type Document {
    "Уникальный идентификатор документа"
    id: ID!
    "Тип документа (например, паспорт)"
    type: String!
    "Номер документа"
    number: String!
    "Дата выдачи"
    issueDate: String
    "Дата окончания действия"
    expiryDate: String
}

"""
Родственник клиента.
"""
type Relative {
    "Уникальный идентификатор родственника"
    id: ID!
    "Тип родства (например, брат, сестра)"
    relationType: String!
    "ФИО родственника"
    name: String!
    "Возраст родственника"
    age: Int
}

"""
Корневые запросы (Queries).
"""
type Query {
    """
    Получить информацию о клиенте по ID.
    Позволяет запросить только нужные поля, включая документы и родственников,
    одним запросом, избегая множественных вызовов.
    """
    client(id: ID!): Client
}